<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="tilecast:formats" content="poster-a4 square story">
<title>Ziarno — otwarcie</title>
<style>
  /* Tone: polished. Concept: one coffee bean, drawn huge and cropped like a still life; editorial serif, lots of air. */
  :root {
    --paper: #f3ece1;
    --espresso: #2b1d14;
    --terracotta: #b8532f;
    --muted: #6f5d4f;
    --rule: rgba(43,29,20,.22);
    --u: 1vmin;
  }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  body { position: relative; background: var(--paper); color: var(--espresso); font-family: 'Instrument Sans', sans-serif; }

  .frame { position: absolute; inset: calc(4.5 * var(--u)); border: 1px solid var(--rule); }

  header { position: absolute; top: calc(7.5 * var(--u)); left: calc(9 * var(--u)); right: calc(9 * var(--u));
    display: flex; justify-content: space-between; align-items: baseline;
    font-weight: 600; font-size: calc(1.9 * var(--u)); letter-spacing: .18em; text-transform: uppercase; color: var(--muted);
    padding-bottom: calc(2 * var(--u)); border-bottom: 1px solid var(--rule); animation: fade 1s ease-out both; }

  .bean { position: absolute; right: -19%; bottom: -9%; width: 71%; transform: rotate(-24deg);
    filter: drop-shadow(0 calc(3 * var(--u)) calc(5 * var(--u)) rgba(43,29,20,.25));
    animation: bean 1.8s cubic-bezier(.16,1,.3,1) both; }

  h1 { position: absolute; left: calc(8 * var(--u)); top: 15%; margin: 0;
    font: 400 calc(31 * var(--u)) / .82 'Instrument Serif', serif; letter-spacing: -0.035em;
    animation: rise 1.2s cubic-bezier(.16,1,.3,1) .35s both; }
  .open { position: absolute; left: calc(9 * var(--u)); top: 35%; margin: 0;
    font: italic 400 calc(7.2 * var(--u)) / 1 'Instrument Serif', serif; color: var(--terracotta);
    animation: rise 1s cubic-bezier(.16,1,.3,1) .7s both; }

  .details { position: absolute; left: calc(9 * var(--u)); right: 52%; bottom: calc(9 * var(--u));
    display: grid; grid-template-columns: 1fr; row-gap: calc(1.2 * var(--u));
    animation: fade 1s ease-out 1s both; }
  .details div { padding-top: calc(1.8 * var(--u)); border-top: 1px solid var(--rule); font-size: calc(2.8 * var(--u)); line-height: 1.35; }
  .details small { display: block; font-size: .66em; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin-bottom: .6em; }
  .details strong { font-weight: 600; }
  .details em { font: italic 400 1.25em/1.1 'Instrument Serif', serif; color: var(--terracotta); }

  @keyframes bean { from { transform: rotate(-40deg) translateY(6%); opacity: 0; } }
  @keyframes rise { from { transform: translateY(calc(4 * var(--u))); opacity: 0; } }
  @keyframes fade { from { opacity: 0; } }

  /* Square: title and details in the left column, the bean cropped bottom right. */
  @media (aspect-ratio > 0.9) {
    .bean { right: -13%; bottom: -8%; width: 50%; }
    h1 { top: 20%; font-size: calc(24 * var(--u)); }
    .open { top: 42%; font-size: calc(6 * var(--u)); }
    .details { right: 48%; bottom: calc(8 * var(--u)); row-gap: 0; }
    .details div { padding-top: calc(1.5 * var(--u)); font-size: calc(2.5 * var(--u)); }
  }

  /* Story: the title stack on top, details on the left, the bean on the right, all clear of the app bars. */
  @media (aspect-ratio < 0.62) {
    header { top: 13%; }
    h1 { top: 20%; font-size: calc(33 * var(--u)); }
    .open { top: 36.5%; font-size: calc(8 * var(--u)); }
    .bean { right: -16%; bottom: 14%; width: 58%; }
    .details { bottom: 19%; right: 50%; }
    .details div { font-size: calc(3.2 * var(--u)); }
  }
</style>
</head>
<body>
  <div class="frame"></div>
  <svg class="bean" viewBox="0 0 200 290" aria-hidden="true">
    <defs>
      <radialGradient id="shade" cx="34%" cy="28%" r="82%">
        <stop offset="0" stop-color="#8a5634"/>
        <stop offset=".55" stop-color="#55321d"/>
        <stop offset="1" stop-color="#2a170c"/>
      </radialGradient>
      <linearGradient id="gloss" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#fff" stop-opacity=".35"/>
        <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <ellipse cx="100" cy="148" rx="90" ry="132" fill="url(#shade)"/>
    <ellipse cx="70" cy="95" rx="34" ry="62" fill="url(#gloss)" transform="rotate(-12 70 95)"/>
    <path d="M104 20 C 64 82, 144 118, 100 172 S 72 252, 100 276" fill="none" stroke="#1f0f06" stroke-width="11" stroke-linecap="round"/>
    <path d="M104 20 C 64 82, 144 118, 100 172 S 72 252, 100 276" fill="none" stroke="#a36a44" stroke-width="2" stroke-linecap="round" opacity=".45" transform="translate(-6 0)"/>
  </svg>

  <header><span>Kawiarnia · Piekarnia</span><span>Nº 01</span></header>
  <h1>Ziarno</h1>
  <p class="open">Otwieramy 12 października</p>
  <div class="details">
    <div><small>Godziny</small><strong>Codziennie</strong><br>7:30 – 19:00</div>
    <div><small>Na start</small><em>Pierwsza kawa gratis</em><br>do 12:00</div>
    <div><small>Adres</small><strong>ul. Długa 7</strong><br>Gdańsk</div>
  </div>
</body>
</html>
